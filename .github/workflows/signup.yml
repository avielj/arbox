name: 🏋️ Arbox Auto-Signup

on:
  # Run daily at 06:01 UTC (same as crontab)
  # NOTE (v2.2.0): GitHub routinely starts scheduled runs 7-9h late, so this
  # lands in the afternoon IST. If classes fill up before then, move the
  # script to a cron on a real server (it was built for that).
  schedule:
    - cron: '1 6 * * *'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run (scheduled runs always do signup)'
        required: false
        default: 'signup'
        type: choice
        options:
          - signup
          - list-friends
          - invite-friend
          - check-invite
      friend_name:
        description: 'Friend full name (invite-friend only)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run (preview only, no signups)'
        required: false
        default: 'false'
        type: boolean

jobs:
  signup:
    runs-on: ubuntu-latest

    # Needed by the keepalive step to push a dummy commit that resets
    # GitHub's 60-day scheduled-workflow inactivity timer.
    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v5

      - name: 🔧 Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl

      - name: 🖼️ Install card dependencies
        # Only needed to render the Telegram photo card; the script falls
        # back to the text report if this fails. Non-fatal by design.
        run: |
          python3 -m pip install --quiet --break-system-packages pillow python-bidi \
            || echo "::warning::Card dependencies failed to install — text report will be used"

      - name: 🔐 Validate secrets
        run: |
          missing=""
          [ -z "${{ secrets.ARBOX_EMAIL }}" ] && missing="$missing ARBOX_EMAIL"
          [ -z "${{ secrets.ARBOX_PASSWORD }}" ] && missing="$missing ARBOX_PASSWORD"
          [ -z "${{ secrets.SIGNUP_HOUR }}" ] && missing="$missing SIGNUP_HOUR"
          [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && missing="$missing TELEGRAM_BOT_TOKEN"
          [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ] && missing="$missing TELEGRAM_CHAT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            echo "Go to Settings → Secrets and variables → Actions to add them."
            exit 1
          fi
          echo "✅ All required secrets are configured"

      - name: 📝 Create .env from secrets
        # Secrets are passed through env vars (not interpolated into the
        # script body) so values containing |, &, \, $ etc. are handled
        # safely and aren't exposed to shell/script injection.
        env:
          ARBOX_EMAIL: ${{ secrets.ARBOX_EMAIL }}
          ARBOX_PASSWORD: ${{ secrets.ARBOX_PASSWORD }}
          SIGNUP_HOUR: ${{ secrets.SIGNUP_HOUR }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAYS_AHEAD: ${{ vars.DAYS_AHEAD || '12' }}
          CLASS_FRIDAY: ${{ vars.CLASS_FRIDAY || 'Fuck You Friday' }}
          CLASS_DEFAULT: ${{ vars.CLASS_DEFAULT || 'CrossFit' }}
          SKIP_DAYS: ${{ vars.SKIP_DAYS || 'Saturday' }}
        run: |
          {
            printf 'ARBOX_EMAIL=%s\n'        "$ARBOX_EMAIL"
            printf 'ARBOX_PASSWORD=%s\n'     "$ARBOX_PASSWORD"
            printf 'SIGNUP_HOUR=%s\n'        "$SIGNUP_HOUR"
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            printf 'TELEGRAM_CHAT_ID=%s\n'   "$TELEGRAM_CHAT_ID"
            printf 'DAYS_AHEAD=%s\n'         "$DAYS_AHEAD"
            printf 'CLASS_FRIDAY=%s\n'       "$CLASS_FRIDAY"
            printf 'CLASS_DEFAULT=%s\n'      "$CLASS_DEFAULT"
            printf 'SKIP_DAYS=%s\n'          "$SKIP_DAYS"
          } > .env

      - name: 🔑 Restore membership cache
        # v2.2.0: signups.csv is cached too — on ephemeral runners the CSV
        # dedup was dead (every run started with an empty CSV).
        uses: actions/cache@v5
        with:
          path: |
            .arbox_cache
            signups.csv
          key: arbox-cache-${{ secrets.ARBOX_EMAIL }}

      - name: 🏋️ Run signup script
        run: |
          chmod +x arbox-signup.sh
          ARGS=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          # Scheduled runs have no inputs: action is empty -> plain signup.
          case "${{ inputs.action }}" in
            list-friends)
              ARGS+=(--list-friends)
              ;;
            invite-friend)
              ARGS+=(--invite-friend "${{ inputs.friend_name }}")
              ;;
              check-invite)
              ARGS+=(--check-invite "${{ inputs.friend_name }}")
              ;;
            *)
              ;;
          esac
          ./arbox-signup.sh "${ARGS[@]}"

      - name: 📊 Show results
        if: always()
        run: |
          echo "=== Last 30 log lines ==="
          tail -30 sign.log 2>/dev/null || echo "No log file"
          echo ""
          echo "=== Cache ==="
          cat .arbox_cache 2>/dev/null || echo "No cache file"

      # Keeps this scheduled workflow alive. GitHub disables cron workflows
      # after 60 days of repository inactivity. This pushes an empty commit
      # only when the latest commit is older than 45 days, resetting the
      # timer. Implemented inline (no third-party action) because this repo's
      # Actions policy only allows GitHub-owned actions.
      - name: ♻️ Keepalive
        if: always()
        run: |
          last_commit_epoch=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last_commit_epoch ) / 86400 ))
          echo "Days since last commit: $age_days"
          if [ "$age_days" -ge 45 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive to keep scheduled workflow active"
            git push origin HEAD:${{ github.ref_name }}
            echo "Pushed keepalive commit."
          else
            echo "No keepalive needed yet (threshold: 45 days)."
          fi
